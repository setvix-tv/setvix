name: Build Setvix TV APK

# Two apps from one repository:
#   Setvix       (tv.setvix.app)       — stable: setvix-android.zip + index.html in the root
#   Setvix Test  (tv.setvix.app.test)  — test:   setvix-android-test.zip + test/index.html
# The test app installs next to the stable one and never touches it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable app (Setvix)
        run: |
          unzip -o setvix-android.zip -d src
          PROJ=$(dirname "$(find src -name settings.gradle | head -n 1)")
          cp index.html "$PROJ/app/src/main/assets/index.html"
          if [ -f site.txt ]; then cp site.txt "$PROJ/app/src/main/assets/site.txt"; fi
          (cd "$PROJ" && gradle assembleRelease --no-daemon)
          cp "$PROJ/app/build/outputs/apk/release/app-release.apk" "$GITHUB_WORKSPACE/setvix-tv.apk"

      - name: Build test app (Setvix Test)
        if: hashFiles('setvix-android-test.zip') != ''
        run: |
          unzip -o setvix-android-test.zip -d srct
          PROJ=$(dirname "$(find srct -name settings.gradle | head -n 1)")
          if [ -f test/index.html ]; then cp test/index.html "$PROJ/app/src/main/assets/index.html"; fi
          (cd "$PROJ" && gradle assembleRelease --no-daemon)
          cp "$PROJ/app/build/outputs/apk/release/app-release.apk" "$GITHUB_WORKSPACE/setvix-tv-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: setvix-tv-apk
          path: setvix-tv*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Setvix TV ${{ github.run_number }}
          files: setvix-tv*.apk
          make_latest: true
