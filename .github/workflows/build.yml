name: Build Setvix TV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP" -d src
          PROJ=$(dirname "$(find src -name settings.gradle | head -n 1)")
          echo "PROJ=$PROJ" >> $GITHUB_ENV
          if [ -f index.html ]; then cp index.html "$PROJ/app/src/main/assets/index.html"; fi
          if [ -f site.txt ]; then cp site.txt "$PROJ/app/src/main/assets/site.txt"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJ"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/setvix-tv.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: setvix-tv-apk
          path: setvix-tv.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Setvix TV ${{ github.run_number }}
          files: setvix-tv.apk
          make_latest: true
